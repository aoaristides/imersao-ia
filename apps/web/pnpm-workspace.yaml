allowBuilds:
  sharp: false
  unrs-resolver: false
# Store compartilhado com o chat-api, na raiz do repositório (docs/lld.md, seção 10).
storeDir: ../../.pnpm-store
# Binários nativos para o host (macOS ou WSL) e para o contêiner Linux, no mesmo node_modules.
supportedArchitectures:
  os: [darwin, linux]
  cpu: [arm64, x64]
  libc: [glibc]
